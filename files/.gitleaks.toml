# .gitleaks.toml
# Secret scanning configuration
# https://github.com/gitleaks/gitleaks

title = "Project Secret Scanning Rules"

[allowlist]
  description = "Allowlisted files and patterns"
  files = [
    ".env.example",          # Example file intentionally has placeholder values
    "tests/**",              # Test files may contain mock keys
    "docs/**",               # Documentation examples
  ]
  regexes = [
    "CHANGEME",              # Explicitly placeholder values
    "sk-XXXX",               # Masked key examples in docs
    "ca-pub-XXXXXXXX",       # AdSense placeholder in docs
  ]

# ── Custom rules ──────────────────────────────────────────────

[[rules]]
  id = "dotenv-file"
  description = "Actual .env file detected in commit"
  regex = '''(?i)(^|/)\.env$'''
  path = '''\.env'''
  severity = "CRITICAL"
  tags = ["security", "env"]

[[rules]]
  id = "hardcoded-password"
  description = "Hardcoded password in source"
  regex = '''(?i)(password|passwd|pwd)\s*=\s*["'][^"']{4,}["']'''
  severity = "HIGH"
  tags = ["security", "password"]

[[rules]]
  id = "hardcoded-api-key"
  description = "Hardcoded API key assignment"
  regex = '''(?i)(api_key|apikey|api-key)\s*=\s*["'][a-zA-Z0-9_\-]{16,}["']'''
  severity = "HIGH"
  tags = ["security", "api-key"]

[[rules]]
  id = "jwt-secret"
  description = "Hardcoded JWT secret"
  regex = '''(?i)(jwt_secret|jwt-secret|jwtsecret)\s*=\s*["'][^"']{8,}["']'''
  severity = "CRITICAL"
  tags = ["security", "jwt"]
